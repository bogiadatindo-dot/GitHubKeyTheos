name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: macos-latest # Sử dụng máy ảo macOS có sẵn Xcode và iOS SDK

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compile KeyAuth.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -fobjc-arc -isysroot "$SDK_PATH" -framework Foundation -framework UIKit KeyAuth.m -o KeyAuth.dylib
          ldid -S KeyAuth.dylib || codesign -s - KeyAuth.dylib || true

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyAuth-dylib
          path: KeyAuth.dylib
